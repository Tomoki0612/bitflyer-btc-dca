<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>取引設定</title>
</head>
<body>
    <h1>取引設定</h1>
    <form id="tradeForm">
        <label for="tradeAmount">取引金額（円）:</label>
        <input type="number" id="tradeAmount" name="tradeAmount" required><br><br>
        <label for="tradeDay">毎月の購入日:</label>
        <input type="number" id="tradeDay" name="tradeDay" min="1" max="31" required><br><br>
        <button type="submit">設定</button>
    </form>

    <script>
        document.getElementById('tradeForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const tradeAmount = document.getElementById('tradeAmount').value;
            const tradeDay = document.getElementById('tradeDay').value;

            fetch('/api/setTradeConfig', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ tradeAmount, tradeDay })
            })
            .then(response => response.json())
            .then(data => {
                alert('設定が保存されました');
            })
            .catch(error => {
                console.error('エラー:', error);
                alert('設定の保存に失敗しました');
            });
        });
    </script>
</body>
</html>
